<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1444" viewBox="0 0 420 1444" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Code to cluster — mobile layout</title>
<desc id="diagram-description">Automatic CI tests source code, builds a Docker image, and checks Helm templates. A separate manually started release publishes to GHCR and deploys with Helm. A Deployment controls a ReplicaSet, which maintains two Flask API pods, while a ClusterIP Service forwards application traffic to both pods.</desc>
<defs>
  <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0b131e"/><stop offset="1" stop-color="#111e2e"/></linearGradient>
  <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#b7adff"/></marker>
  <marker id="traffic-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#79ead5"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f5f8ff;font-weight:700;letter-spacing:-.7px}.body{fill:#bccbdd}.small{fill:#8fa6bd;font-weight:600;letter-spacing:1.2px}.node-title{fill:#f3f7ff;font-weight:700}.node-body{fill:#b6c7d9}.connection{fill:none;stroke:#b7adff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.traffic{stroke:#79ead5;marker-end:url(#traffic-arrow)}.control{stroke-dasharray:7 6}</style>
</defs>
<rect width="420" height="1444" rx="20" fill="url(#canvas)"/>
<rect x="1" y="1" width="418" height="1442" rx="19" fill="none" stroke="#273b50"/>
