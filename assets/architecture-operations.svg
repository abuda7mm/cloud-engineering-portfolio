<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Detect, decide, respond — cloud operations</title>
<desc id="diagram-description">An EC2 status-check metric triggers a CloudWatch alarm. EventBridge filters the selected alarm and invokes Lambda, which validates the event and instance. A DynamoDB conditional write rejects duplicate IDs. New events pass a recovery authorization check: reboot must be enabled, the instance tag authorized, and the instance running. The function sends an SNS notification describing the decision.</desc>
<defs>
  <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0b131e"/><stop offset="1" stop-color="#111e2e"/></linearGradient>
  <marker id="arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#ffc58d"/></marker>
  <marker id="traffic-arrow" viewBox="0 0 12 12" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L11 6L1 11Z" fill="#79ead5"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f5f8ff;font-weight:700;letter-spacing:-.7px}.body{fill:#bccbdd}.small{fill:#8fa6bd;font-weight:600;letter-spacing:1.2px}.node-title{fill:#f3f7ff;font-weight:700}.node-body{fill:#b6c7d9}.connection{fill:none;stroke:#ffc58d;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.traffic{stroke:#79ead5;marker-end:url(#traffic-arrow)}.control{stroke-dasharray:7 6}</style>
</defs>
<rect width="1200" height="840" rx="20" fill="url(#canvas)"/>
<rect x="1" y="1" width="1198" height="838" rx="19" fill="none" stroke="#273b50"/>
<path d="M24 1H1176" stroke="#ffc58d" stroke-width="2" opacity=".75"/>

<text x="44" y="38" font-size="13" class="small" text-anchor="start" style="fill:#ffc58d">PROJECT 03 / CLOUD OPERATIONS</text>
<text x="44" y="83" font-size="36" class="title" text-anchor="start">Detect, decide, respond</text>
<text x="44" y="115" font-size="18" class="body" text-anchor="start">An exact alarm match. An explicit recovery decision. A clear incident notification.</text>
